[project]
name = "crown-agent"
version = "0.1.0"
description = "Crown Letter Trading Agent — thesis-first translation engine + backtester"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pypdf>=5.0",
    "alpaca-py>=0.33",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# The v1 prototype parser (crown.compiler.parse_letter) still imports the
# Anthropic SDK. It is superseded by crown.letter (OpenAI) and removed in Phase 1.
legacy = [
    "anthropic>=0.40",
]

[project.scripts]
crown = "crown.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
